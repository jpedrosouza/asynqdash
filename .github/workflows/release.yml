name: Release

on:
  release:
    types:
      - published
  # Allows attaching binaries to an existing release, e.g. after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.8.0)"
        required: true

permissions:
  # Required to upload release assets.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # The UI is embedded from the committed ui/build (CI checks that it matches the sources),
      # so the binaries contain exactly what `go get` users get.
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          bin=asynqdash
          if [ "$GOOS" = "windows" ]; then bin=asynqdash.exe; fi
          go build -trimpath -ldflags="-s -w" -o "$bin" ./cmd/asynqdash
          tar -czvf "asynqdash_${TAG}_${GOOS}_${GOARCH}.tar.gz" "$bin" LICENSE README.md

      - name: Upload release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "asynqdash_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" --clobber
