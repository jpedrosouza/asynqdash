name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run build

      # The UI build is embedded into the Go package, so it must be committed
      # for `go get` users. Fail if it is out of date with the sources.
      - name: Check that ui/build is up to date
        run: |
          if [ -n "$(git status --porcelain -- build)" ]; then
            echo "ui/build is out of date. Run 'make assets' and commit the result."
            git status --short -- build
            exit 1
          fi

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - run: go vet ./...
      - run: go test ./...
